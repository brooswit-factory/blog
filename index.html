<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preload" href="fonts/cinzel-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/eb-garamond-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<title>Brooswit Factory Blog</title>
<meta name="description" content="Brooswit Factory blog: coming soon.">
<style>
  @font-face { font-family:"Cinzel"; font-weight:700; font-display:swap; src:url(fonts/cinzel-latin-700-normal.woff2) format("woff2"); }
  @font-face { font-family:"EB Garamond"; font-weight:400; font-display:swap; src:url(fonts/eb-garamond-latin-400-normal.woff2) format("woff2"); }
  :root { color-scheme: dark; --bg:#0d0b09; --fg:#eadfc4; --gold:#d9a441; --link:#f0c56a; }
  body { margin:0; background:var(--bg); color:var(--fg); font:400 1.35rem/1.65 "EB Garamond",Georgia,serif; text-align:center; }
  img { display:block; width:100%; height:auto; }
  main { max-width:64rem; margin:0 auto; padding:clamp(24px,5vw,64px) 24px; }
  h1 { margin:0 0 .4em; font:700 clamp(2.4rem,6vw,4rem)/1.15 "Cinzel",Georgia,serif; color:var(--gold); letter-spacing:.04em; }
  p { font-size:clamp(1.25rem,2.6vw,1.6rem); }
  a { color:var(--link); }
</style>
</head>
<body>
<img src="assets/blog.jpg" alt="Brooswit Factory blog">
<main>
  <h1>Coming soon</h1>
  <p>The Brooswit Factory blog is on its way. In the meantime, see the <a href="https://factory.brooswit.nexus">factory homepage</a>.</p>
</main>
</body>
</html>
