<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brooswit Factory Blog</title>
<meta name="description" content="Brooswit Factory blog: coming soon.">
<style>
  :root { color-scheme: light dark; --bg:#fff; --fg:#1a1a1a; --muted:#555; --link:#0b5fd6; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111; --fg:#eee; --muted:#aaa; --link:#7db1ff; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui,sans-serif; text-align:center; }
  main { max-width:960px; margin:0 auto; padding:0 16px 48px; }
  img { max-width:100%; height:auto; }
  .banner { width:100%; display:block; }
  p { color:var(--muted); }
  a { color:var(--link); }
</style>
</head>
<body>
<img class="banner" src="assets/factoryheader.jpg" alt="Brooswit Factory">
<main>
  <h1>Coming soon</h1>
  <p>The Brooswit Factory blog is on its way. In the meantime, see the <a href="https://factory.brooswit.nexus">factory homepage</a>.</p>
</main>
</body>
</html>
