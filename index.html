<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preload" href="fonts/cinzel-decorative-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/im-fell-english-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<title>Brooswit Factory Blog</title>
<meta name="description" content="Brooswit Factory blog: under construction. Pardon our mess.">
<style>
  @font-face { font-family:"Cinzel Decorative"; font-weight:700; font-display:swap; src:url(fonts/cinzel-decorative-latin-700-normal.woff2) format("woff2"); }
  @font-face { font-family:"IM Fell English"; font-weight:400; font-display:swap; src:url(fonts/im-fell-english-latin-400-normal.woff2) format("woff2"); }
  :root { color-scheme: dark; --bg:#0d0b09; --fg:#eadfc4; --gold:#d9a441; --link:#f0c56a; }
  body { margin:0; background:var(--bg); color:var(--fg); font:400 1.4rem/1.7 "IM Fell English",Georgia,serif; text-align:center; }
  img { display:block; width:100%; height:auto; }
  main { max-width:64rem; margin:0 auto; padding:clamp(24px,5vw,64px) 24px; }
  h1, h2 { margin:0 0 .4em; font:700 clamp(1.7rem,6vw,4rem)/1.2 "Cinzel Decorative",Georgia,serif; color:var(--gold); letter-spacing:.03em; text-wrap:balance; overflow-wrap:break-word; }
  h2 { font-size:clamp(1.3rem,3.5vw,2.2rem); margin-bottom:.8em; }
  p { font-size:clamp(1.25rem,2.6vw,1.6rem); }
  a { color:var(--link); }
</style>
</head>
<body>
<img src="assets/blog.jpg" alt="Brooswit Factory blog">
<main>
  <h1>Under construction</h1>
  <h2>Pardon our mess.</h2>
  <p>The Brooswit Factory blog is on its way. In the meantime, see the <a href="https://factory.brooswit.nexus">factory homepage</a>.</p>
</main>
</body>
</html>
